
services:
  postgres:
    image: postgres:16
    container_name: hearing-aid-postgres
    environment:
      POSTGRES_DB: hearing_aid
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user -d hearing_aid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
