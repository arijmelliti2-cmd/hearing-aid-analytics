name: Dashboard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dashboard-tests:
    name: Test dashboard metrics
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dashboard/requirements.txt
          pip install pytest

      - name: Run dashboard unit tests
        run: |
          PYTHONPATH=dashboard python -m pytest dashboard/tests -v